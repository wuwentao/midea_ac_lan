---
name: Bug 报告（中文）
description: 报告集成、设备或实体无法正常工作
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请完整填写模板并上传完整 debug 日志（附件形式）。
        请勿公开账号、密码、Token、Key、完整设备 ID、MAC 地址或其他敏感信息。
        若问题属于设备协议解析或控制命令，维护者可能会将其转至 midea-lan；本仓库主要负责 Home Assistant 集成层。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读 [README](https://github.com/wuwentao/midea_ac_lan/blob/main/README_hans.md)、对应设备文档和 [Debug 文档](https://github.com/wuwentao/midea_ac_lan/blob/main/doc/debug_hans.md)。
          required: true
        - label: 我已搜索现有 Issue，未找到相同问题。
          required: true
        - label: 我已删除日志中的账号、密码、Token、Key 等敏感信息，并将完整日志作为附件上传。
          required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Core 版本
      placeholder: 2026.10.0
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: midea_ac_lan 版本
      placeholder: 2026.10.0
    validations:
      required: true

  - type: input
    id: last_working_version
    attributes:
      label: 最后正常工作的版本
      description: 如果从未正常工作，请填写“不适用”。
      placeholder: 不适用
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备类型、型号与脱敏 SN
      description: 提供设备类型（如 0xAC）、型号/SN8，并仅保留 SN 中排查所需的部分字符。
      placeholder: 0xAC / KFR-xx / SN8 ABCD1234 / SN ...1234
    validations:
      required: true

  - type: dropdown
    id: cloud
    attributes:
      label: 设备所在 App / Cloud
      description: 名称与集成配置界面保持一致。
      options:
        - 美的美居
        - SmartHome
        - Midea Air
        - NetHome Plus
        - Ariston Clima
        - TSmartLife
        - Toshiba Iolife
        - 不适用 / 手工配置
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述与复现步骤
      description: 说明具体设备、操作步骤、实际结果、预期结果，以及官方 App 中的对应行为。
      placeholder: |
        1. 操作步骤：
        2. 实际结果：
        3. 预期结果：
        4. 官方 App 中的结果：
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 完整 debug 日志
      description: 开启 debug 后重现问题，将脱敏后的完整日志文件拖放到此处。不要只粘贴自认为相关的片段。预设账号错误可忽略；云端问题请提供本人账号登录阶段的日志。
      placeholder: 将日志文件拖放到这里
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 其他信息
      description: 可添加官方 App 截图、诊断信息或相关 Issue 链接；请先移除敏感信息。
