---
name: 新设备或功能请求（中文）
description: 请求支持新设备类型，或为已有设备增加功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新设备协议通常需要三个仓库协作：midea-lua 保存协议来源，midea-lan 实现协议，midea_ac_lan 暴露 Home Assistant 实体。
        请勿上传账号、密码、Token、Key 或未脱敏的设备标识。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读 [README](https://github.com/wuwentao/midea_ac_lan/blob/main/README_hans.md)、对应设备文档和[新增设备指南](https://github.com/wuwentao/midea_ac_lan/blob/main/doc/adding-a-new-device.zh-Hans.md)。
          required: true
        - label: 我已搜索现有 Issue，未找到相同请求。
          required: true
        - label: 我能提供官方 App 中存在该功能的截图或其他证据，且已移除敏感信息。
          required: true

  - type: dropdown
    id: request_type
    attributes:
      label: 请求类型
      options:
        - 支持新的设备类型
        - 为已支持的设备增加属性或控制功能
        - 改进 Home Assistant 实体或交互
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备类型、型号与脱敏 SN
      description: 提供设备类型、型号/SN8；仅保留完整 SN 中排查所需的部分字符。
      placeholder: 0xD9 / model ABCD1234 / SN ...1234
    validations:
      required: true

  - type: dropdown
    id: cloud
    attributes:
      label: 设备所在 App / Cloud
      options:
        - 美的美居
        - SmartHome
        - Midea Air
        - NetHome Plus
        - Ariston Clima
        - TSmartLife
        - Toshiba Iolife
        - 不适用 / 手工配置
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: 功能需求与官方 App 行为
      description: 准确描述要读取或控制的功能、官方 App 的操作逻辑、显示结果，以及希望在 Home Assistant 中如何呈现。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图、日志与协议来源
      description: 已支持设备新增功能时，请上传脱敏后的完整 debug 日志和官方 App 截图。若已有 midea-lua 文件、midea-lan Issue/PR 或协议资料，请提供链接。
      placeholder: 将文件拖放到此处，并添加相关链接
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 其他信息
      description: 可补充设备差异、已尝试方案或关联 Issue。
