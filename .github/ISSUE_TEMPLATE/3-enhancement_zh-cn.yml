---
name: 新设备或功能请求（中文）
description: 请求支持新设备类型，或为已有设备增加功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新设备协议通常需要三个仓库协作：midea-lua 保存协议来源，midea-lan 实现协议，midea_ac_lan 暴露 Home Assistant 实体。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读 [README](https://github.com/wuwentao/midea_ac_lan/blob/main/README_hans.md)、对应设备文档。
          required: true
        - label: 我能提供官方 App 中存在该功能的截图或其他证据。
          required: true

  - type: dropdown
    id: request_type
    attributes:
      label: 请求类型
      options:
        - 支持新的设备类型
        - 为已支持的设备增加属性或控制功能
        - 改进 Home Assistant 实体或交互
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备类型及设备SN
      placeholder: Air Conditioner 22012225
      description: |
        > 设备型号可以在 配置 -> 设备与服务 -> Midea AC LAN -> 设备 -> 设备信息 找到
        > SN可以在 配置 -> 设备与服务 -> Midea AC LAN -> 添加设备 -> Just list appliances 找到
        > SN也可以在美居app的设备信息中查看
        > SN可以通过首页README的debug文档中使用discovery功能获取
    validations:
      required: true

  - type: dropdown
    id: cloud
    attributes:
      label: 设备所在 App / Cloud
      options:
        - 美的美居
        - SmartHome
        - Midea Air
        - NetHome Plus
        - Ariston Clima
        - TSmartLife
        - Toshiba Iolife
        - 不适用 / 手工配置
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: 功能需求与官方 App 行为
      description: 准确描述要读取或控制的功能、官方 App 的操作逻辑、显示结果，以及希望在 Home Assistant 中如何呈现。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图、日志与协议来源
      description: 请上传官方 App 功能截图及对应的功能可选值。
      placeholder: 将截图拖放到此处，并填写功能可选值
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 其他信息
      description: 可补充设备差异、已尝试方案或关联 Issue。
