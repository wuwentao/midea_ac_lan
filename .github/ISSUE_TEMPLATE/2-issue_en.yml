---
name: Bug report (English)
description: Report an integration, appliance, or entity that is not working correctly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Complete every required field and attach the full debug log as a file.
        Never publish account credentials, passwords, Tokens, Keys, full device IDs, MAC addresses, or other secrets.
        Protocol parsing and device-command problems may need to be fixed in midea-lan; this repository primarily contains the Home Assistant integration layer.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I have read the [README](https://github.com/wuwentao/midea_ac_lan/blob/main/README.md), the documentation for my appliance type, and the [debug guide](https://github.com/wuwentao/midea_ac_lan/blob/main/doc/debug.md).
          required: true
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I removed credentials, passwords, Tokens, Keys, and other secrets, and will attach the complete debug log as a file.
          required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Core version
      placeholder: 2026.10.0
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: midea_ac_lan version
      placeholder: 2026.10.0
    validations:
      required: true

  - type: input
    id: last_working_version
    attributes:
      label: Last known working version
      description: Enter N/A if it has never worked.
      placeholder: N/A
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device type, model, and redacted serial number
      description: Include the hexadecimal type (for example 0xAC), model/SN8, and only the serial-number characters needed for diagnosis.
      placeholder: 0xAC / model KFR-xx / SN8 ABCD1234 / SN ...1234
    validations:
      required: true

  - type: dropdown
    id: cloud
    attributes:
      label: App / Cloud containing the appliance
      description: Names match the integration setup screen and are intentionally not translated.
      options:
        - 美的美居
        - SmartHome
        - Midea Air
        - NetHome Plus
        - Ariston Clima
        - TSmartLife
        - Toshiba Iolife
        - N/A / manually configured
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction steps
      description: Identify the appliance and describe the exact action, actual result, expected result, and corresponding official-app behavior.
      placeholder: |
        1. Steps to reproduce:
        2. Actual result:
        3. Expected result:
        4. Result in the official app:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Complete debug log
      description: Enable debug logging, reproduce the problem, redact secrets, and drag the complete log file here. Do not paste only selected lines. Ignore preset-account errors; for cloud failures, include logs from the login attempt using your own account.
      placeholder: Drag the log file here
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add redacted official-app screenshots, diagnostics, or related issue links if useful.
