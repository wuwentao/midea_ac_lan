---
name: Bug report (English)
description: Report an integration, appliance, or entity that is not working correctly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Complete every required field and attach the full debug log as a file.
        Without appliance details and a complete debug log, the problem cannot be confirmed and the issue will be closed; no other information is needed.
        Protocol parsing and device-command problems may need to be fixed in midea-lan; this repository primarily contains the Home Assistant integration layer.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I have read the [README](https://github.com/wuwentao/midea_ac_lan/blob/main/README.md), the documentation for my appliance type, and the [debug guide](https://github.com/wuwentao/midea_ac_lan/blob/main/doc/debug.md).
          required: true
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I provided the appliance details and complete debug log.
          required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Core version
      placeholder: 2026.10.0
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: midea_ac_lan version
      placeholder: 2026.10.0
    validations:
      required: true

  - type: input
    id: last_working_version
    attributes:
      label: Last known working version
      description: Enter N/A if it has never worked.
      placeholder: N/A
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device type and Device SN
      placeholder: Air Conditioner, SN 22012225xxxxxx
      description: |
        > The model can be found in Settings -> Devices & Services -> Midea AC LAN -> Devices -> Device Info
        > The SN can be found in Settings -> Devices & Services -> Midea AC LAN -> Add device -> Just list appliances
        > The SN also can be found in your SmartHome APP
        > The SN also can be discovered via the discovery command in the debug guide
    validations:
      required: true

  - type: dropdown
    id: cloud
    attributes:
      label: App / Cloud containing the appliance
      description: Names match the integration setup screen and are intentionally not translated.
      options:
        - 美的美居
        - SmartHome
        - Midea Air
        - NetHome Plus
        - Ariston Clima
        - TSmartLife
        - Toshiba Iolife
        - N/A / manually configured
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction steps
      description: Identify the appliance and describe the exact action, actual result, expected result, and corresponding official-app behavior.
      placeholder: |
        1. Steps to reproduce:
        2. Actual result:
        3. Expected result:
        4. Result in the official app:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Complete debug log
      description: Enable debug logging, reproduce the problem, and drag the complete log file here. Do not paste only selected lines. Many startup and initialization parameters are important for analysis. Bugs often apply only to a specific appliance subtype, not every model/subtype. For some appliances, the customize parameters in the corresponding appliance documentation may resolve the problem.
      placeholder: Drag the log file here
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add official-app screenshots, diagnostics, or related issue links if useful.
