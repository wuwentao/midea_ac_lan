---
name: New appliance or feature request (English)
description: Request a new appliance type or a feature for an existing appliance
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        New device protocols commonly span three repositories: midea-lua preserves protocol sources, midea-lan implements the protocol, and midea_ac_lan exposes Home Assistant entities.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I have read the [README](https://github.com/wuwentao/midea_ac_lan/blob/main/README.md) and my appliance documentation.
          required: true
        - label: I can provide an official-app screenshot or other evidence that the requested feature exists.
          required: true

  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      options:
        - Support a new appliance type
        - Add an attribute or control to a supported appliance
        - Improve a Home Assistant entity or interaction
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device type and Device SN
      placeholder: Air Conditioner, SN 22012225xxxxxx
      description: |
        > The model can be found in Settings -> Devices & Services -> Midea AC LAN -> Devices -> Device Info
        > The SN can be found in Settings -> Devices & Services -> Midea AC LAN -> Add device -> Just list appliances
        > The SN also can be found in your SmartHome APP
        > The SN also can be discovered via the discovery command in the debug guide
    validations:
      required: true

  - type: dropdown
    id: cloud
    attributes:
      label: App / Cloud containing the appliance
      options:
        - 美的美居
        - SmartHome
        - Midea Air
        - NetHome Plus
        - Ariston Clima
        - TSmartLife
        - Toshiba Iolife
        - N/A / manually configured
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: Requested behavior and official-app workflow
      description: Describe the value or control, how the official app operates and displays it, and how it should appear in Home Assistant.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots and feature options
      description: Upload an official-app feature screenshot and the corresponding selectable feature values.
      placeholder: Drag screenshots here and list the selectable feature values
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add appliance variants, attempted solutions, or related issues if useful.
