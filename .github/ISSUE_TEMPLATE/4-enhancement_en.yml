---
name: New appliance or feature request (English)
description: Request a new appliance type or a feature for an existing appliance
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        New device protocols commonly span three repositories: midea-lua preserves protocol sources, midea-lan implements the protocol, and midea_ac_lan exposes Home Assistant entities.
        Never upload credentials, passwords, Tokens, Keys, or unredacted device identifiers.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I have read the [README](https://github.com/wuwentao/midea_ac_lan/blob/main/README.md), my appliance documentation, and the [adding-a-new-device guide](https://github.com/wuwentao/midea_ac_lan/blob/main/doc/adding-a-new-device.md).
          required: true
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: I can provide a redacted official-app screenshot or other evidence that the requested feature exists.
          required: true

  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      options:
        - Support a new appliance type
        - Add an attribute or control to a supported appliance
        - Improve a Home Assistant entity or interaction
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device type, model, and redacted serial number
      description: Include the type and model/SN8, but retain only the full-serial characters needed for diagnosis.
      placeholder: 0xD9 / model ABCD1234 / SN ...1234
    validations:
      required: true

  - type: dropdown
    id: cloud
    attributes:
      label: App / Cloud containing the appliance
      options:
        - 美的美居
        - SmartHome
        - Midea Air
        - NetHome Plus
        - Ariston Clima
        - TSmartLife
        - Toshiba Iolife
        - N/A / manually configured
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: Requested behavior and official-app workflow
      description: Describe the value or control, how the official app operates and displays it, and how it should appear in Home Assistant.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, and protocol sources
      description: For a supported appliance, attach a redacted complete debug log and official-app screenshots. Link any relevant midea-lua file, midea-lan issue/PR, or protocol source.
      placeholder: Drag files here and add related links
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add appliance variants, attempted solutions, or related issues if useful.
