# Manual release workflow
#
# Usage (maintainers only):
#   1. Go to Actions → Manual Release → Run workflow
#   2. Enter version number (e.g., 2026.9.1)
#   3. Review and merge the generated release PR
#   4. The create-release.yml workflow auto-tags and publishes the GitHub release
#   5. The release.yml workflow builds and attaches the midea_ac_lan.zip
#
# This workflow:
#   - Validates version format (X.Y.Z)
#   - Generates changelog from conventional commits (via git-cliff)
#   - Updates custom_components/midea_ac_lan/manifest.json
#   - Creates a release branch and opens a PR with all changes
#
# Benefits over automatic release-please:
#   - Single PR per release (not two)
#   - Manual version control (CalVer-friendly, no auto-increment from feat: commits)
#   - Full control over version numbers
name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 2026.9.1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main # Always use main branch (not the selected ref from workflow_dispatch)
          fetch-depth: 0 # Need full history for changelog generation
          token: ${{ secrets.GH_TOKEN }}

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in format X.Y.Z (e.g., 2026.9.1)"
            exit 1
          fi

      - name: Check if version already exists
        run: |
          if git tag | grep -q "^v${{ inputs.version }}$"; then
            echo "Error: Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Install git-cliff
        run: |
          curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.7.0/git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin

      - name: Get last release tag
        id: last_tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT
          echo "Last release tag: ${LAST_TAG:-none}"

      - name: Generate changelog for new version
        run: |
          if [ -n "${{ steps.last_tag.outputs.last_tag }}" ]; then
            # Incremental: generate only new changes since last tag
            git-cliff ${{ steps.last_tag.outputs.last_tag }}..HEAD \
              --tag v${{ inputs.version }} \
              --prepend CHANGELOG.md
          else
            # First release: generate full changelog
            git-cliff --tag v${{ inputs.version }} \
              --prepend CHANGELOG.md
          fi

      - name: Update version in component manifest
        run: |
          # Update custom_components/midea_ac_lan/manifest.json
          jq --arg v "${{ inputs.version }}" '.version = $v' \
            custom_components/midea_ac_lan/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/midea_ac_lan/manifest.json

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch and commit
        id: branch
        run: |
          BRANCH="release-${{ inputs.version }}"
          # Recreate the branch locally (any stale local ref is overwritten)
          git checkout -B "${BRANCH}"
          git add CHANGELOG.md custom_components/midea_ac_lan/manifest.json
          git commit -m "chore(main): release ${{ inputs.version }}" \
            -m "Release version ${{ inputs.version }}" \
            -m "" \
            -m "Changes:" \
            -m "- Update CHANGELOG.md" \
            -m "- Update version in manifest.json" \
            -m "" \
            -m "Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          # Force-push to overwrite any stale branch from a previous failed run.
          # Safe: release-* branches are not protected by the repo ruleset.
          git push --force origin "${BRANCH}"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PR_BODY="## Release ${{ inputs.version }}

          This PR was automatically generated by the manual release workflow.

          ### Changes in this release

          See [CHANGELOG.md](https://github.com/wuwentao/midea_ac_lan/blob/${{ steps.branch.outputs.branch }}/CHANGELOG.md) for details.

          ### Checklist before merging

          - [ ] Version number is correct: **${{ inputs.version }}**
          - [ ] CHANGELOG.md has been updated
          - [ ] All CI checks pass

          ---
          🤖 Generated by Manual Release workflow"

          # Reuse an existing PR from a previous run if one is still open
          EXISTING_PR=$(gh pr list --head "${{ steps.branch.outputs.branch }}" --base main --state open --json url --jq '.[0].url')
          if [ -n "${EXISTING_PR}" ]; then
            PR_URL="${EXISTING_PR}"
            echo "ℹ️  Reusing existing open PR: ${PR_URL}"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "${{ steps.branch.outputs.branch }}" \
              --title "chore(main): release ${{ inputs.version }}" \
              --body "${PR_BODY}")
            echo "✅ Release PR created: ${PR_URL}"
          fi

          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "### 🎉 Release PR Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ steps.branch.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: ${{ steps.create_pr.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the PR and verify the changelog" >> $GITHUB_STEP_SUMMARY
          echo "2. Merge the PR to trigger the release" >> $GITHUB_STEP_SUMMARY
