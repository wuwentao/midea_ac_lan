name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: HA ${{ matrix.ha }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            ha: "2024.4.1"
            group: test
          - python: "3.13"
            ha: "2024.12.1"
            group: test
          - python: "3.14"
            ha: "2026.3.1"
            group: test
          - python: "3.14"
            ha: "2026.11.0b4"
            group: test-current
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install matching HA test harness
        run: >-
          uv sync --locked --no-default-groups
          --group ${{ matrix.group }} --python ${{ matrix.python }}

      - name: Test and report coverage
        run: >-
          uv run --no-sync pytest
          --cov=custom_components.midea_ac_lan
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --junitxml=pytest-results.xml

      - name: Publish coverage summary
        run: >-
          uv run --no-sync coverage report --format=markdown
          | tee coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.ha }}-py${{ matrix.python }}
          path: |
            coverage.xml
            coverage.md
            htmlcov/
            pytest-results.xml
          if-no-files-found: error

  coverage:
    name: Coverage gate
    needs: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download canonical coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-2024.4.1-py3.12
          path: coverage-report

      - name: Upload coverage to Codecov
        continue-on-error: >-
          ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage-report/coverage.xml
          name: ha-2024.4.1-py3.12
          use_oidc: true
          version: v11.3.2
